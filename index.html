<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmployeeHub - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-brand">

            <div class="brand-content">

                <div class="logo">
                    EH
                </div>

                <h1>EmployeeHub</h1>

                <p class="tagline">
                    One Portal. Every Employee Need.
                </p>

                <p class="description">
                    Access your workplace services, manage administrative
                    needs, and stay connected with your company in one place.
                </p>

            </div>

        </div>


        <div class="login-form-container">

            <div class="login-form">

                <span class="welcome">
                    Welcome Back 👋
                </span>

                <h2>Sign in to your account</h2>

                <p class="login-description">
                    Enter your employee credentials to continue.
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="employeeId">
                            Employee ID
                        </label>

                        <input
                            type="text"
                            id="employeeId"
                            placeholder="Enter your employee ID"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                        >

                    </div>


                    <div class="form-options">

                        <label class="remember">
                            <input type="checkbox">
                            Remember me
                        </label>

                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <button type="submit" class="login-button">
                        Sign In
                    </button>

                </form>

                <p class="login-footer">
                    Employee Self-Service Portal
                </p>

            </div>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>
</html>
